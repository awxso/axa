
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXA MEDIA | لوحة التحكم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Tahoma,Arial,sans-serif}
header{padding:20px;background:#111;border-bottom:1px solid #b89446;display:flex;justify-content:space-between;align-items:center}
.logo{color:#d8b45b;font-size:23px;font-weight:bold}
main{max-width:1000px;margin:30px auto;padding:15px}
.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:22px;margin-bottom:20px}
h2{color:#d8b45b;margin-top:0}
input,textarea,select{width:100%;padding:13px;margin:8px 0 15px;background:#090909;color:white;border:1px solid #444;border-radius:8px;font-size:15px}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:8px;padding:12px 18px;background:#c5a04d;color:#080808;font-weight:bold;font-size:14px;cursor:pointer;margin:4px}
button:hover{opacity:.85}
.danger{background:#a83232;color:white}
.secondary{background:#333;color:white}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.item{background:#202020;border:1px solid #333;border-radius:12px;padding:15px}
.item h3{color:#e0bd6c}
small{color:#aaa}
.status{color:#d8b45b;margin:10px 0}
#logout{background:#333;color:white}
label{color:#ccc}
</style>
</head>
<body>

<header>
 <div class="logo">AXA MEDIA</div>
 <button id="logout" class="hidden" onclick="logout()">تسجيل الخروج</button>
</header>

<main>

<section id="loginBox" class="card">
 <h2>دخول المدير</h2>
 <p>سجل الدخول إلى لوحة إدارة AXA MEDIA</p>
 <label>البريد الإلكتروني</label>
 <input id="email" type="email" placeholder="البريد الإلكتروني">
 <label>كلمة المرور</label>
 <input id="password" type="password" placeholder="كلمة المرور">
 <button onclick="login()">تسجيل الدخول</button>
 <p id="loginStatus" class="status"></p>
</section>

<section id="dashboard" class="hidden">
 <div class="card">
  <h2>لوحة التحكم</h2>
  <p>مرحباً بك في إدارة محتوى AXA MEDIA.</p>
  <div id="status" class="status"></div>
 </div>

 <div class="card">
  <h2 id="formTitle">إضافة محتوى جديد</h2>

  <label>عنوان المحتوى</label>
  <input id="title" placeholder="اكتب عنوان المحتوى">

  <label>الوصف</label>
  <textarea id="description" placeholder="وصف المحتوى"></textarea>

  <label>نوع المحتوى</label>
  <select id="type">
   <option value="video">فيديو</option>
   <option value="image">صورة</option>
   <option value="audio">صوتيات</option>
   <option value="article">مقال</option>
  </select>

  <label>التصنيف</label>
  <select id="category">
   <option value="">بدون تصنيف</option>
  </select>

  <label>ملف المحتوى</label>
  <input id="file" type="file">

  <label>أو رابط المحتوى</label>
  <input id="mediaUrl" type="url" placeholder="https://...">

  <label>رابط صورة الغلاف (اختياري)</label>
  <input id="thumbnail" type="url" placeholder="https://...">

  <label><input id="featured" type="checkbox" style="width:auto"> محتوى مميز</label>
  <br>
  <label><input id="published" type="checkbox" checked style="width:auto"> نشر المحتوى مباشرة</label>
  <br><br>

  <button onclick="saveItem()">حفظ المحتوى</button>
  <button class="secondary" onclick="resetForm()">إلغاء التعديل</button>
 </div>

 <div class="card">
  <h2>إدارة المحتوى</h2>
  <button onclick="loadItems()">تحديث القائمة</button>
  <div id="items" class="grid"></div>
 </div>
</section>

</main>

<script>
const SUPABASE_URL = "https://dlexcynznymukwtmkisq.supabase.co";
const SUPABASE_KEY = "sb_publishable_DOMZONghGoTSukaPhLrE_w_XZh9-Swt";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let editingId = null;

const $ = id => document.getElementById(id);

function message(text){
 $("status").textContent = text;
}

async function login(){
 const email = $("email").value.trim();
 const password = $("password").value;

 $("loginStatus").textContent = "جارٍ تسجيل الدخول...";

 const {data,error} = await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  $("loginStatus").textContent = "تعذر الدخول: " + error.message;
  return;
 }

 currentUser = data.user;
 await checkAdmin();
}

async function checkAdmin(){
 const {data,error} = await db
  .from("admins")
  .select("user_id")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(error || !data){
  await db.auth.signOut();
  currentUser = null;
  $("loginStatus").textContent = "هذا الحساب ليس لديه صلاحية المدير.";
  return;
 }

 $("loginBox").classList.add("hidden");
 $("dashboard").classList.remove("hidden");
 $("logout").classList.remove("hidden");

 await loadCategories();
 await loadItems();
}

async function logout(){
 await db.auth.signOut();
 currentUser = null;
 $("dashboard").classList.add("hidden");
 $("loginBox").classList.remove("hidden");
 $("logout").classList.add("hidden");
}

async function loadCategories(){
 const {data,error} = await db
  .from("categories")
  .select("id,name")
  .order("name");

 if(error){
  message("تعذر تحميل التصنيفات.");
  return;
 }

 $("category").innerHTML = '<option value="">بدون تصنيف</option>';

 (data || []).forEach(cat=>{
  const option = document.createElement("option");
  option.value = cat.id;
  option.textContent = cat.name;
  $("category").appendChild(option);
 });
}

async function saveItem(){
 const title = $("title").value.trim();
 const type = $("type").value;
 const file = $("file").files[0];

 if(!title){
  message("اكتب عنوان المحتوى أولاً.");
  return;
 }

 let mediaUrl = $("mediaUrl").value.trim();

 if(file){
  message("جارٍ رفع الملف...");

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path = currentUser.id + "/" + Date.now() + "-" + safeName;

  const {data,error} = await db.storage
   .from("media")
   .upload(path,file,{upsert:false});

  if(error){
   message("فشل رفع الملف: " + error.message);
   return;
  }

  const result = db.storage.from("media").getPublicUrl(data.path);
  mediaUrl = result.data.publicUrl;
 }

 if(type !== "article" && !mediaUrl){
  message("اختر ملفاً أو أدخل رابط المحتوى.");
  return;
 }

 const record = {
  title,
  description:$("description").value.trim(),
  media_type:type,
  media_url:mediaUrl || null,
  thumbnail_url:$("thumbnail").value.trim() || null,
  category_id:$("category").value || null,
  is_featured:$("featured").checked,
  is_published:$("published").checked
 };

 let result;

 if(editingId){
  result = await db.from("media_items")
   .update(record).eq("id",editingId);
 }else{
  result = await db.from("media_items").insert(record);
 }

 if(result.error){
  message("تعذر الحفظ: " + result.error.message);
  return;
 }

 message("تم حفظ المحتوى بنجاح.");
 resetForm();
 await loadItems();
}

async function loadItems(){
 const {data,error} = await db
  .from("media_items")
  .select("*,categories(name)")
  .order("created_at",{ascending:false});

 if(error){
  $("items").textContent = "تعذر تحميل المحتوى: " + error.message;
  return;
 }

 $("items").innerHTML = "";

 (data || []).forEach(item=>{
  const card = document.createElement("div");
  card.className = "item";

  const heading = document.createElement("h3");
  heading.textContent = item.title;

  const details = document.createElement("small");
  details.textContent =
   (item.categories?.name || "بدون تصنيف") +
   " • " + (item.is_published ? "منشور" : "مخفي");

  const edit = document.createElement("button");
  edit.textContent = "تعديل";
  edit.onclick = ()=>editItem(item);

  const publish = document.createElement("button");
  publish.className = "secondary";
  publish.textContent = item.is_published ? "إخفاء" : "نشر";
  publish.onclick = ()=>togglePublish(item);

  const del = document.createElement("button");
  del.className = "danger";
  del.textContent = "حذف";
  del.onclick = ()=>deleteItem(item.id);

  card.append(heading,details,document.createElement("br"),edit,publish,del);
  $("items").appendChild(card);
 });
}

function editItem(item){
 editingId = item.id;
 $("formTitle").textContent = "تعديل المحتوى";
 $("title").value = item.title || "";
 $("description").value = item.description || "";
 $("type").value = item.media_type;
 $("category").value = item.category_id || "";
 $("mediaUrl").value = item.media_url || "";
 $("thumbnail").value = item.thumbnail_url || "";
 $("featured").checked = item.is_featured;
 $("published").checked = item.is_published;
 $("file").value = "";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function togglePublish(item){
 const {error} = await db.from("media_items")
  .update({is_published:!item.is_published})
  .eq("id",item.id);

 if(error){
  message("تعذر تغيير حالة النشر: " + error.message);
  return;
 }

 await loadItems();
}

async function deleteItem(id){
 if(!confirm("هل تريد حذف هذا المحتوى من قاعدة البيانات؟")) return;

 const {error} = await db.from("media_items").delete().eq("id",id);

 if(error){
  message("تعذر الحذف: " + error.message);
  return;
 }

 message("تم حذف سجل المحتوى.");
 await loadItems();
}

function resetForm(){
 editingId = null;
 $("formTitle").textContent = "إضافة محتوى جديد";
 ["title","description","mediaUrl","thumbnail","file"].forEach(id=>{
  $(id).value = "";
 });
 $("featured").checked = false;
 $("published").checked = true;
}

db.auth.onAuthStateChange((event,session)=>{
 if(event === "SIGNED_OUT"){
  currentUser = null;
 }
});

(async()=>{
 const {data} = await db.auth.getSession();
 if(data.session){
  currentUser = data.session.user;
  await checkAdmin();
 }
})();
</script>
</body>
</html>
